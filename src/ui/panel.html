<header class="wai-head">
  <h2>Conversas esquecidas</h2>
  <button class="wai-close" aria-label="Fechar">×</button>
</header>

<div class="wai-tabs" role="tablist" aria-label="Seções do painel">
  <button class="wai-tab is-active" id="wai-tab-scan" type="button" role="tab"
          data-tab="scan" aria-selected="true" aria-controls="wai-pane-scan">Varredura</button>
  <button class="wai-tab" id="wai-tab-list" type="button" role="tab"
          data-tab="list" aria-selected="false" aria-controls="wai-pane-list" tabindex="-1">Conversas</button>
  <button class="wai-tab" id="wai-tab-ignored" type="button" role="tab"
          data-tab="ignored" aria-selected="false" aria-controls="wai-pane-ignored" tabindex="-1">Ignoradas</button>
</div>

<p class="wai-status">Clique em “Varrer conversas” para montar a lista.</p>

<section class="wai-pane" id="wai-pane-scan" role="tabpanel"
         aria-labelledby="wai-tab-scan" data-pane="scan">
  <div class="wai-controls">
    <label>Mostrar a partir de
      <input class="wai-min" type="number" min="0" value="0"> dias
    </label>
    <button class="wai-scan">Varrer conversas</button>
  </div>
</section>

<section class="wai-pane" id="wai-pane-list" role="tabpanel"
         aria-labelledby="wai-tab-list" data-pane="list" hidden>
  <div class="wai-controls">
    <input class="wai-search" type="search" placeholder="Filtrar por nome">
  </div>
  <ol class="wai-list"></ol>
  <footer class="wai-foot">
    <button class="wai-csv" disabled>Exportar CSV</button>
  </footer>
</section>

<section class="wai-pane" id="wai-pane-ignored" role="tabpanel"
         aria-labelledby="wai-tab-ignored" data-pane="ignored" hidden>
  <p class="wai-empty">Nenhuma conversa ignorada.</p>
  <ol class="wai-ignored-list"></ol>
</section>
